name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: tests + public verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test every guarantee in the README
        run: python -m unittest discover -s tests -v
      - name: Verify the public ledger (no private data needed)
        run: python eilikrineia.py verify

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.13.3
      - run: ruff format --check .
      - run: ruff check .
